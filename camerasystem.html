<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <title>Camera System</title>
<style>
    body {font-family: sans-serif; text-align: center;}

    video {width: 100%; max-width: 480px; background: black;}
    #library {display: flex; flex-wrap: wrap; justify-content: center;}
    .photo {margin: 6px; }
    .photo img {width: 150px; display: block;} 
  </style>
  </head>
<body> 
    <h1>Camera</h1>
    <video id="preview" autoplay playsinline muted></video>
    <br>
    <button id="photoBtn">Take photo</button>
    <!--Demo only:-->
    <div id="demoUpload">
        <p>Demo: upload a picture<p>
            <input type="file" id="uploadInput" accept="image/*">
    </div>
    <!--End of Demo code-->

    <h2>Photo Library</h2>
    <div id="library"></div>

    <script>
        const preview = document.getELementById("preview");
        const library = document.getElementById("library");

        // Turning on the camera
        navigator.mediaDevices.getUserMedia({video: true})
          .then(stream => {preview.scrObject = stream; })
          .catch(err => alert("Camera error: " + err.message));

       //Open the database
       function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open("camerasystem", 1);
            request.onupgradeneeded = () => {
                request.result.createObjectStore("photos", {keyPath: "id", autoIncrement: true});
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
       }

       // Saving a photo
       async function savePhotos(photo) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
            const request = db.transaction("photos", "readwrite")
              .objectStore("photos").add(photo);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);  
        });
       }

       // Getting saved photos
       async function getAllPhotos() {
        const db = await openDb();
        return new Promise(resolve => {
            const request = db.transaction("photos").objectStore("photos").getAll();
            request.onsuccess = () => resolve(request.result);
        });
       }
       
       //Deleting photos
       async function deletePhoto(id) {
        const db = await openDB();
        return new Promise(resolve => {
            const tx = db.transaction("photos","readwrite");
            tx.objectStore("photos").delete(id);
            tx.oncomplete = resolve;
        });
       }

       //Delete button on photos
       function showPhoto(photo) {
        const box = document.createElement("div");
        box.className = "photo";

        const img = document.createElements("img");
        img.src = URL.createObjectURL(photo.blob);

        const deleteBtn = document.createElement("buttun");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = async () => {
            await deletePhoto(photo.id);
            box.remove();
        };
        box.append(img, deleteBtn);
        library.prepend(box);
       }

       //Taking a photo
       document.getElementById("photoBtn").onclick = async () => {
        const canvas = document.createElement("canvas");
        canvas.width = preview.videoWidth;
        canvas.height = preview.videoHeight;
        canvas.getContext("2d").drawimage(preview, 0, 0);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
        const photo = {blob: blob, created: Date.now() };

        photo.id = await savePhoto(photo);
        showPhoto(photo);
       };

       // Shows saved photos when this opens
       (async () => {
        const photos = await getAllPhotos();
        photos.forEach(showPhoto);
       }) ();

       // Demo only code
       document.getElementById("uploadInput").onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const photo = {blob: file, created: Date.now() };
        photo.id = await savePhoto(photo);
        showPhoto(photo);
        document.getElementById("demoUpload").remove();
       };
       //Demo ended
    </script>
   </body>
   </html>
