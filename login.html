    <li class = "list-items"> Password shouldnot have special characters </li>  
    </ul>
  </div>
  <div> 
    <input type="button" value="reset" id="reset" onclick="checkreset()"> 
    <input type="button" value="submit" id="submit" onclick="checkpass()"> 
  </div> 
</form> 
<div id="message"></div> 
<div id="message2"></div>
