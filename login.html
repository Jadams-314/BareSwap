<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<link rel="stylesheet" href="stylesheets/bareswap.css">
</head>
<body>

<div class="logo-container">
  <img src="test image 2.jpg" alt="Logo" class="logo-img">
  <div class="overlay-text">Bare Swap</div>
</div>

<form id="login-form">
  <label for="user">Username:</label>
  <input type="text" id="user" name="username" placeholder="Username" required>
  <br><br>

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" placeholder="Password" required>
  <br><br>

  <input type="reset" value="reset" id="reset">
  <input type="submit" value="Log In" id="submit">
</form>

<div id="message"></div>
<div id="message2"></div>

<a href="login.html">Create Account</a>
<br>
<a href="index.html">Homepage</a>

<script src="./javascript/log.js"></script>
</body>
</html>
