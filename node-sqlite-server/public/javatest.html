<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Swap - Open Store</title>
    <link rel="stylesheet" href="./stylesheets/bareswap.css">
</head>
<body>
    <div class="logo-container">
        <img src="./images/test-image-2.jpg" alt="Logo" class="logo-img">
        <div class="overlay-text">Bare Swap</div>
    </div>

    <div id="store-container">
        <div class="item-card">
            <h3 class="item-name">Server Management</h3>
            <p>Initialize and launch the backend application environment.</p>
            <p class="price" id="output">Status: Ready to launch</p>
            <button class="buy-btn" id="runBtn">Open Store!</button>
        </div>
    </div>

    <a href="/">Home Page</a>
    <a href="list">List an Item</a>

    <script>
        document.getElementById('runBtn').addEventListener('click', async () => {
            const runButton = document.getElementById('runBtn');
            const outputElement = document.getElementById('output');

            outputElement.textContent = "Getting ready to SWAP!...";
            runButton.disabled = true;

            try {
                const response = await fetch('http://localhost:3000/run-java');
                const data = await response.json();
                
                outputElement.textContent = data.output;
            } catch (error) {
                outputElement.textContent = "Error connecting to server.";
                console.error(error);
                runButton.disabled = false;
            }
        });
    </script>
</body>
</html>
