<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Swap</title>
    <link rel="stylesheet" href="./stylesheets/bareswap.css">
   
</head>
<body>
    <div class="logo-container">
        <img src="./images/test-image-2.jpg" alt="Logo" class="logo-img">
        <div class="overlay-text">Bare Swap</div>
    </div>
    <form>
    </form>
    <!--<script src="./javascript/store.js"></script> -->
    <a href="/">Home Page</a>
    <a href="list">List an Item</a>
    
    <store id="store-container">Loading items...</store>

    <script>
        async function loadItems() {
            const container = document.getElementById('store-container');
            try {
                //fetch data from Items array
                const response = await fetch('http://localhost:3000/items');
                const items = await response.json();
                
                
                container.innerHTML = '';
                
                if (items.length === 0) {
                    container.innerHTML = '<p>No items in store.</p>';
                    return;
                }
                
                // Loop through database items and render them(replaces div 'item-card' which is blank with the following code
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item-card';
                    div.innerHTML = `
                        <h3 class="item-name">${item.name}</h3>
                        <p>${item.description || 'No description provided.'}</p>
                        <p class="price">$${Number(item.price || 0).toFixed(2)}</p>
                        <button class="buy-btn">Buy Now</button>
                    `;
                    
                    // Add click event listener to the buy button, When clicked. price element changes from the int price from db to 'SOLD'
                    const buyButton = div.querySelector('.buy-btn');
                    buyButton.addEventListener('click', () => {
                        const nameElement = div.querySelector('.item-name');
                        const priceElement = div.querySelector('.price');
                        //nameElement.textContent = `Sold: ${item.name}`;
                        priceElement.textContent = 'SOLD';
                        buyButton.disabled = true; 
        
        setTimeout(async () => {
          try {
            // When an item is bought it is removed from the database. If the item is succesfuly removed and there are no items left 'No items in teh store.' is displayed.
            const deleteResponse = await fetch(`http://localhost:3000/items/${item.id || item._id}`, {
              method: 'DELETE'
            });

            if (deleteResponse.ok) {
              div.remove();
              if (container.children.length === 0) {
                container.innerHTML = '<p>No items in store.</p>';
              }
            } else {
              console.error('Failed to delete item from server.');
              priceElement.textContent = 'Error updating database';
              buyButton.disabled = false;
            }
          } catch (err) {
            console.error('Network error during deletion:', err);
            priceElement.textContent = 'Network Error';
            buyButton.disabled = false;
          }
        }, 3000);
      });

                    container.appendChild(div);
                });
            } catch (error) {
                container.innerHTML = `<p style="color:red">Error loading store: ${error.message}</p>`;
            }
        }

        
        loadItems();
    </script>
</body>
</html>
