<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Items Portfolio</title>
    <style>
        
        body {
            font-family: "SansSerif", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: rgb(245, 245, 247);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        
        #container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        
        #contentPanel {
            display: grid;
            grid-template-columns: 1fr;
            row-gap: 10px;
        }

        
        .card {
            background-color: #FFFFFF;
            border: 1px solid rgb(220, 220, 225);
            border-radius: 4px; 
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        
        .name-label {
            font-size: 16px;
            font-weight: bold;
            color: rgb(33, 33, 33);
            margin: 0;
        }

        
        .desc-label {
            font-size: 13px;
            color: rgb(110, 110, 115);
            max-width: 300px;
            margin: 5px 0 8px 0;
            line-height: 1.4;
        }

        
        .price-label {
            font-size: 14px;
            font-weight: bold;
            color: rgb(0, 122, 255);
            margin: 0;
        }

        .error-message {
            color: #ff3b30;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="contentPanel"></div>
    </div>

    <script>
        
        async function loadItems() {
            const contentPanel = document.getElementById('contentPanel');
            
            try {
                const response = await fetch('http://localhost:3000/items');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const items = await response.json();
                
                
                items.forEach(item => {
                    
                    const name = item.name || 'Unnamed Item';
                    const description = item.description || 'No description provided.';
                    const price = typeof item.price === 'number' ? item.price : parseFloat(item.price) || 0.0;

                    
                    const card = document.createElement('div');
                    card.className = 'card';

                    const nameLabel = document.createElement('div');
                    nameLabel.className = 'name-label';
                    nameLabel.textContent = name;

                    const descLabel = document.createElement('div');
                    descLabel.className = 'desc-label';
                    descLabel.textContent = description;

                    const priceLabel = document.createElement('div');
                    priceLabel.className = 'price-label';
                    priceLabel.textContent = `$${price.toFixed(2)}`;

                    
                    card.appendChild(nameLabel);
                    card.appendChild(descLabel);
                    card.appendChild(priceLabel);
                    contentPanel.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading store: ", error.message);
                contentPanel.innerHTML = `<div class="error-message">Error loading store layout. Check console rules or CORS config.</div>`;
            }
        }

        
        loadItems();
    </script>
</body>
</html>
