<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="stylesheets/bareswap.css">
</head>
<body>

<div class="logo-container">
    <img src="test image 2.jpg" alt="Logo" class="logo-img">
    <div class="overlay-text">Bare Swap</div>
</div>

<form id="signup-form">
    <input type="text" id="first_name" placeholder="First Name" required>
    <input type="text" id="last_name" placeholder="Last Name" required>
    <input type="email" id="email" placeholder="Email" required>

    <input type="password" id="first" placeholder="Password"
           class="password-input">
    <input type="password" id="second" placeholder="Re-enter Password">

    <div class="password-checklist">
        <h3 class="checklist_requiremnts">Password must be</h3>
        <ul class="checklist">
            <li class="list-items">Password must be 8 characters long</li>
            <li class="list-items">Password should have I love BSU in it</li>
            <li class="list-items">Password should have 2 numbers in it</li>
            <li class="list-items">Password should not have special characters</li>
        </ul>
    </div>

    <div>
        <input type="reset" value="reset" id="reset">
        <input type="submit" value="submit" id="submit">
    </div>
</form>

<div id="message"></div>
<div id="message2"></div>

<script src="./javascript/signup.js"></script>

<a href="index.html">Homepage</a>
<a href="login.html">Log In</a>

</body>
</html>
